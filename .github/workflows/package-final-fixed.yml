name: Package Final Fixed Portable Project

on:
  push:
    branches:
      - artifact/final-fixed-42988cf9
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-final-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact fixed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 42988cf9d9b5415ae0dd7f3e7487e65e13ad74bd
          clean: true
          fetch-depth: 1

      - name: Verify repository and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/repo_quality.py
          python3 -m unittest Scripts.tests.test_environment_gui_contract -v
          python3 Tests/test_cp1_package_integrity.py
          python3 Scripts/ci_verify.py

      - name: Build clean UTF-8 portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ROOT="BUNKER_BEATS_2026_FIXED_GUI_CLICKSTART_main_42988cf9"
          OUT_DIR="$RUNNER_TEMP/package-output"
          STAGE="$RUNNER_TEMP/$PACKAGE_ROOT"
          rm -rf "$OUT_DIR" "$STAGE"
          mkdir -p "$OUT_DIR" "$STAGE"

          rm -rf Diagnostics Binaries DerivedDataCache Intermediate Saved .pytest_cache
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          rsync -a ./ "$STAGE/" \
            --exclude '.git/' \
            --exclude 'Binaries/' \
            --exclude 'DerivedDataCache/' \
            --exclude 'Diagnostics/' \
            --exclude 'Intermediate/' \
            --exclude 'Saved/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '*.pyc' \
            --exclude '.DS_Store'

          cat > "$STAGE/PAKET_INFO.txt" <<'EOF'
          BUNKER BEATS 2026 — FIXED GUI + LINUX CLICK-&-START
          ===================================================
          Quelle: provoware/bunkergame
          Branch: main
          Commit: 42988cf9d9b5415ae0dd7f3e7487e65e13ad74bd
          Paketstatus: FIXED_GUI_CLICKSTART_HOSTED_VERIFIED

          Behoben:
          - Tkinter KeyError 'after'
          - expliziter Environment Summary Contract v2 mit before + after
          - defensive GUI-Auswertung bei alten/teilweisen Payloads
          - Worker-/Darstellungsfehler töten den Tkinter-Poll nicht mehr
          - Linux Startskripte als echte ausführbare Git-Dateien (100755)
          - Regressionstest für Execute-Bits

          Vor Paketierung geprüft:
          - Scripts/repo_quality.py
          - Scripts.tests.test_environment_gui_contract
          - Tests/test_cp1_package_integrity.py
          - Scripts/ci_verify.py

          Erwartung ohne installierte Unreal Engine 5.8:
          - Environment Doctor meldet UNREAL YELLOW
          - Gesamtstatus bleibt YELLOW
          - GUI darf dabei nicht abstürzen

          CP1 Runtime bleibt UNOBSERVED/BLOCKED, bis ein echter UE-5.8-Lauf erfolgreich ausgeführt wurde.
          EOF

          export PACKAGE_ROOT OUT_DIR STAGE
          python3 - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path

          package_root = os.environ["PACKAGE_ROOT"]
          stage = Path(os.environ["STAGE"])
          out = Path(os.environ["OUT_DIR"]) / f"{package_root}.zip"

          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9, strict_timestamps=False) as archive:
              for path in sorted(stage.rglob("*")):
                  rel = path.relative_to(stage.parent)
                  arcname = str(rel).replace(os.sep, "/")
                  if path.is_dir():
                      info = zipfile.ZipInfo(arcname + "/")
                      info.create_system = 3
                      info.external_attr = (stat.S_IFDIR | (path.stat().st_mode & 0o777)) << 16
                      archive.writestr(info, b"")
                      continue
                  info = zipfile.ZipInfo.from_file(path, arcname=arcname)
                  info.create_system = 3
                  info.external_attr = (stat.S_IFREG | (path.stat().st_mode & 0o777)) << 16
                  with path.open("rb") as source, archive.open(info, "w", force_zip64=True) as target:
                      while True:
                          chunk = source.read(1024 * 1024)
                          if not chunk:
                              break
                          target.write(chunk)
          PY

          (cd "$OUT_DIR" && sha256sum "${PACKAGE_ROOT}.zip" > "${PACKAGE_ROOT}.zip.sha256")
          echo "PACKAGE_FILE=$OUT_DIR/${PACKAGE_ROOT}.zip" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA=$OUT_DIR/${PACKAGE_ROOT}.zip.sha256" >> "$GITHUB_ENV"

      - name: Upload final complete project package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BUNKER_BEATS_2026_FIXED_GUI_CLICKSTART_main_42988cf9
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.PACKAGE_FILE }}
            ${{ env.PACKAGE_SHA }}
