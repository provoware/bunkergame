name: P0 Infrastructure Observer

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-infrastructure-observer
  cancel-in-progress: true

jobs:
  p0-infrastructure-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Collect live P0 infrastructure evidence
        id: collect
        continue-on-error: true
        run: >-
          python3 Scripts/github_p0_evidence.py
          --output Diagnostics/Infrastructure/github_p0_evidence.json

      - name: Validate stored evidence against GitHub live
        id: validate
        continue-on-error: true
        run: >-
          python3 Scripts/github_p0_evidence_validate.py
          --evidence Diagnostics/Infrastructure/github_p0_evidence.json

      - name: Upload P0 infrastructure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p0-infrastructure-evidence
          path: Diagnostics/Infrastructure/github_p0_evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce observer result after artifact upload
        if: always()
        run: |
          echo "Collector: ${{ steps.collect.outcome }}"
          echo "Validator: ${{ steps.validate.outcome }}"
          test "${{ steps.collect.outcome }}" = "success"
          test "${{ steps.validate.outcome }}" = "success"
