name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify repository and CP1 contracts
        run: python3 Scripts/ci_verify.py
      - name: Reject generated runtime files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__|Diagnostics|Saved|Intermediate|Binaries)(/|$)|\.pyc$'; then
            echo 'Generated/runtime files are tracked.' >&2
            exit 1
          fi
